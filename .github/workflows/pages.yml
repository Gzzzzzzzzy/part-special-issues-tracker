name: Deploy public tracker
on:
  push:
    branches: [main]
    paths: ['index.html', 'data.json', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Refresh special-issue candidates']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Validate and stage public files only
        run: |
          python -c "import json; d=json.load(open('data.json')); assert isinstance(d['records'],list) and len(d['records']) > 0"
          mkdir _site
          cp index.html data.json _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy public page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
